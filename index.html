<!DOCTYPE html>
<html>
<head>
    <title>Debug Mode</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body { font-family: sans-serif; text-align: center; background: #121212; color: white; padding: 20px; }
        button { background: #007bff; color: white; padding: 20px; border-radius: 10px; border: none; font-size: 18px; }
    </style>
</head>
<body>
    <h2>Uji Tombol</h2>
    <button id="test-btn">KLIK SAYA UNTUK TES</button>
    <p id="output">Belum diklik</p>

    <script>
        document.getElementById('test-btn').addEventListener('click', function() {
            document.getElementById('output').innerText = "JS BERHASIL BERJALAN!";
            alert("JS Anda berfungsi dengan baik!");
        });
    </script>
</body>
</html>
