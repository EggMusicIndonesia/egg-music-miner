<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Egg Music Miner</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>
<body>

    <h1>Egg Music Miner</h1>
    <button id="mining-btn">▶️ MULAI MINING</button>

    <script>
        // Inisialisasi Telegram WebApp
        const tg = window.Telegram.WebApp;
        tg.ready();

        const btn = document.getElementById('mining-btn');

        btn.addEventListener('click', async () => {
            const userId = tg.initDataUnsafe?.user?.id;
            
            if (!userId) {
                alert("Gagal mendapatkan ID User!");
                return;
            }

            // Mengirim data ke API
            try {
                const response = await fetch('/api', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ telegram_id: userId })
                });

                if (response.ok) {
                    alert("Mining Berhasil! Saldo ditambah.");
                } else {
                    alert("Terjadi kesalahan pada server.");
                }
            } catch (error) {
                alert("Gagal terhubung ke server.");
            }
        });
    </script>
</body>
</html>
