<!DOCTYPE html>
<html>
<head>
    <title>Egg Music Miner</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body { background: #000; color: #fff; font-family: sans-serif; text-align: center; padding: 20px; }
        .card { background: #1a1a1a; padding: 30px; border-radius: 20px; border: 2px solid #2ecc71; }
        .btn-play { background: #ff0000; color: white; width: 100%; padding: 20px; border-radius: 10px; border: none; font-size: 18px; font-weight: bold; cursor: pointer; }
        .btn-claim { background: #2ecc71; color: white; width: 100%; padding: 20px; border-radius: 10px; border: none; font-size: 18px; font-weight: bold; display: none; margin-top: 20px; }
    </style>
</head>
<body>
    <div class="card">
        <h2>Egg Music Miner 🥚</h2>
        <p id="status">Tekan tombol di bawah untuk mulai:</p>
        <button class="btn-play" onclick="buka()">▶️ NONTON LAGU</button>
        <button id="btn-claim" class="btn-claim" onclick="klaim()">💰 KLAIM POIN</button>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();
        const params = new URLSearchParams(window.location.search);
        const songId = params.get('song_id') || 'oO6ZfaIMhog';

        function buka() {
            tg.openLink('https://www.youtube.com/watch?v=' + songId);
            document.getElementById('status').innerText = "Menunggu 30 detik...";
            setTimeout(() => {
                document.getElementById('btn-claim').style.display = 'block';
                document.getElementById('status').innerText = "Waktu habis! Silakan klaim.";
            }, 30000);
        }

        async function klaim() {
            const sb = window.supabase.createClient('https://tawqbyyzckcdmdluhxis.supabase.co', 'sb_publishable_bRnN4OTn2ToANaPAiOiDpA__oFt8X9o');
            const user = tg.initDataUnsafe?.user?.id || 0;
            document.getElementById('btn-claim').innerText = "Memproses...";
            const { error } = await sb.from('user_progress').insert([{telegram_id: user, song_id: songId}]);
            
            if (error) { alert("Error: " + error.message); } 
            else { tg.showAlert("Sukses! Poin masuk."); tg.close(); }
        }
    </script>
</body>
</html>
