<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>Egg Music Miner</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body { background: #000; color: #fff; font-family: sans-serif; text-align: center; padding: 20px; }
        .card { background: #1a1a1a; padding: 25px; border-radius: 20px; border: 1px solid #333; }
        .user-info { background: #222; padding: 15px; border-radius: 12px; margin-bottom: 20px; border: 1px solid #444; text-align: left; }
        button { width: 100%; padding: 18px; border-radius: 12px; border: none; font-size: 16px; font-weight: bold; cursor: pointer; margin-top: 10px; }
        .btn-play { background: #ff0000; color: white; }
        .btn-claim { background: #2ecc71; color: white; display: none; }
    </style>
</head>
<body>
    <div class="card">
        <h2>Egg Music Miner 🥚</h2>
        <div class="user-info">
            👤 <span id="user-name">Memuat...</span><br>
            Tugas: <strong id="user-tasks">0</strong> | 💰 <strong id="user-points">0</strong> Poin
        </div>
        <p id="status">Memuat data...</p>
        <button id="btn-play" class="btn-play" onclick="buka()">▶️ NONTON LAGU</button>
        <button id="btn-claim" class="btn-claim" onclick="klaim()">💰 KLAIM POIN</button>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();
        
        // Mengambil data user dengan fallback aman
        const userData = tg.initDataUnsafe?.user || { id: 7659693582, username: 'eghas_music' };
        document.getElementById('user-name').innerText = userData.username;

        const headers = {
            'apikey': 'sb_publishable_bRnN4OTn2ToANaPAiOiDpA__oFt8X9o',
            'Authorization': 'Bearer sb_publishable_bRnN4OTn2ToANaPAiOiDpA__oFt8X9o',
            'Content-Type': 'application/json'
        };

        async function init() {
            try {
                // Ambil data progres & airdrop
                const [res1, res2] = await Promise.all([
                    fetch(`https://tawqbyyzckcdmdluhxis.supabase.co/rest/v1/user_progress?telegram_id=eq.${userData.id}&order=last_complete.desc&limit=1`, { headers }),
                    fetch(`https://tawqbyyzckcdmdluhxis.supabase.co/rest/v1/laporan_airdrop?telegram_id=eq.${userData.id}`, { headers })
                ]);
                
                const dataProg = await res1.json();
                const dataAirdrop = await res2.json();

                // Update UI
                document.getElementById('user-tasks').innerText = dataAirdrop[0]?.total_tugas_selesai || 0;
                document.getElementById('user-points').innerText = dataAirdrop[0]?.total_poin || 0;

                // Cek 24 jam
                if (dataProg.length > 0 && dataProg[0].last_complete) {
                    const diff = (new Date() - new Date(dataProg[0].last_complete)) / (1000 * 60 * 60);
                    if (diff < 24) {
                        document.getElementById('status').innerText = "Tugas sudah selesai. Kembali besok!";
                        document.getElementById('btn-play').disabled = true;
                        return;
                    }
                }
                document.getElementById('status').innerText = "Siap menambang!";
            } catch (e) {
                document.getElementById('status').innerText = "Error: Cek koneksi.";
            }
        }

        function buka() {
            tg.openLink('https://www.youtube.com/watch?v=oO6ZfaIMhog');
            document.getElementById('btn-play').style.display = 'none';
            document.getElementById('btn-claim').style.display = 'block';
            document.getElementById('status').innerText = "Selesai nonton? Klik Klaim.";
        }

        async function klaim() {
            await fetch('https://tawqbyyzckcdmdluhxis.supabase.co/rest/v1/user_progress', {
                method: 'POST',
                headers: headers,
                body: JSON.stringify({ 
                    telegram_id: userData.id, 
                    username: userData.username, 
                    song_id: "oO6ZfaIMhog", 
                    last_complete: new Date().toISOString() 
                })
            });
            tg.showAlert("Sukses! 100 Poin ditambahkan.");
            location.reload();
        }

        init();
    </script>
</body>
</html>
