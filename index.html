<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>Egg Music Miner</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body { background: #000; color: #fff; font-family: sans-serif; text-align: center; padding: 20px; }
        .card { background: #1a1a1a; padding: 25px; border-radius: 20px; border: 1px solid #333; }
        .user-info { background: #222; padding: 15px; border-radius: 12px; margin-bottom: 20px; border: 1px solid #444; font-size: 14px; text-align: left; display: flex; justify-content: space-between; align-items: center; }
        .poin-box { color: #2ecc71; font-weight: bold; font-size: 18px; text-align: right; }
        button { width: 100%; padding: 18px; border-radius: 12px; border: none; font-size: 16px; margin-top: 15px; font-weight: bold; cursor: pointer; }
        .btn-play { background: #ff0000; color: white; }
        .btn-claim { background: #2ecc71; color: white; display: none; }
        button:disabled { background: #444; color: #888; cursor: not-allowed; }
    </style>
</head>
<body>
    <div class="card">
        <h2>Egg Music Miner 🥚</h2>
        <div class="user-info">
            <div>👤 <strong id="user-name">User</strong><br>
                 <span style="font-size: 12px; color: #aaa;">Tugas: <strong id="user-tasks">0</strong></span>
            </div>
            <div class="poin-box">💰 <span id="user-points">0</span> Poin</div>
        </div>
        <p id="status">Memeriksa status harian...</p>
        <button id="btn-play" class="btn-play" onclick="buka()">▶️ NONTON LAGU</button>
        <button id="btn-claim" class="btn-claim" onclick="klaim()">💰 KLAIM POIN</button>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();
        
        const userId = tg.initDataUnsafe?.user?.id || 7659693582; 
        const username = tg.initDataUnsafe?.user?.username || 'eghas_music';
        document.getElementById('user-name').innerText = username;

        const headers = {
            'apikey': 'sb_publishable_bRnN4OTn2ToANaPAiOiDpA__oFt8X9o',
            'Authorization': 'Bearer sb_publishable_bRnN4OTn2ToANaPAiOiDpA__oFt8X9o',
            'Content-Type': 'application/json'
        };

        async function updateData() {
            // Cek data progres terakhir untuk hitungan 24 jam
            const response = await fetch(`https://tawqbyyzckcdmdluhxis.supabase.co/rest/v1/user_progress?telegram_id=eq.${userId}&order=last_complete.desc&limit=1`, { headers });
            const data = await response.json();
            
            // Cek data laporan air drop
            const resAirdrop = await fetch(`https://tawqbyyzckcdmdluhxis.supabase.co/rest/v1/laporan_airdrop?telegram_id=eq.${userId}`, { headers });
            const dataAirdrop = await resAirdrop.json();

            const userAirdrop = dataAirdrop[0] || {};
            document.getElementById('user-tasks').innerText = userAirdrop.total_tugas_selesai || 0;
            document.getElementById('user-points').innerText = userAirdrop.total_poin || 0;

            // Logika pengecekan 24 jam
            if (data.length > 0 && data[0].last_complete) {
                const lastTime = new Date(data[0].last_complete).getTime();
                const now = new Date().getTime();
                const selisihJam = (now - lastTime) / (1000 * 60 * 60);

                if (selisihJam < 24) {
                    document.getElementById('status').innerText = "Tugas sudah selesai. Kembali lagi nanti!";
                    document.getElementById('btn-play').disabled = true;
                    document.getElementById('btn-play').innerText = "MENUNGGU 24 JAM";
                } else {
                    document.getElementById('status').innerText = "Siap menambang hari ini!";
                }
            }
        }
        
        updateData();

        function buka() {
            tg.openLink('https://www.youtube.com/watch?v=oO6ZfaIMhog');
            document.getElementById('btn-play').style.display = 'none';
            document.getElementById('btn-claim').style.display = 'block';
            document.getElementById('status').innerText = "Silakan tonton, lalu klaim.";
        }

        async function klaim() {
            const body = { 
                telegram_id: userId, 
                username: username, 
                song_id: "oO6ZfaIMhog", 
                last_complete: new Date().toISOString() // Menyimpan waktu saat ini ke database
            };
            
            await fetch('https://tawqbyyzckcdmdluhxis.supabase.co/rest/v1/user_progress', {
                method: 'POST',
                headers: headers,
                body: JSON.stringify(body)
            });
            
            tg.showAlert("Sukses! 100 Poin ditambahkan.");
            location.reload();
        }
    </script>
</body>
</html>
