<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body { background: #0b0e14; color: white; text-align: center; font-family: sans-serif; padding: 20px; }
        #action-btn { 
            padding: 15px 30px; font-size: 18px; cursor: pointer; 
            background: #ff9500; border: none; border-radius: 10px; color: white;
            box-shadow: 0 0 15px #ff9500; transition: 0.3s;
        }
    </style>
</head>
<body>
    <div id="status" style="margin-bottom:20px;">Siap untuk mining koin musik?</div>
    <audio id="music-player" src="https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3"></audio>
    <button id="action-btn" onclick="startTask()">MULAI TONTON</button>

    <script>
        const tg = window.Telegram.WebApp;
        tg.ready();

        async function startTask() {
            const btn = document.getElementById('action-btn');
            const status = document.getElementById('status');
            const player = document.getElementById('music-player');

            // 1. Prioritas: Musik diputar agar tidak mati
            status.innerText = "Sedang Mendengarkan...";
            player.play();
            btn.innerText = "Sedang Berjalan...";

            // 2. Kirim data ke API dengan penanganan error yang diam
            try {
                // Menggunakan path yang paling standar di Vercel
                await fetch('/api/index', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ 
                        telegram_id: tg.initDataUnsafe?.user?.id || 7659693582, 
                        task_id: 1 
                    })
                });
            } catch (e) {
                console.log("Server tidak terjangkau, musik tetap berjalan.");
            }
        }
    </script>
</body>
</html>
