<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>Egg Music Miner</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body { background: #000; color: #fff; font-family: sans-serif; text-align: center; padding: 20px; }
        .card { background: #1a1a1a; padding: 25px; border-radius: 20px; border: 1px solid #333; }
        .user-info { background: #222; padding: 15px; border-radius: 12px; margin-bottom: 20px; border: 1px solid #444; font-size: 14px; text-align: left; display: flex; justify-content: space-between; align-items: center; }
        .poin-box { color: #2ecc71; font-weight: bold; font-size: 18px; text-align: right; }
        button { width: 100%; padding: 18px; border-radius: 12px; border: none; font-size: 16px; margin-top: 15px; font-weight: bold; cursor: pointer; }
        .btn-play { background: #ff0000; color: white; }
        .btn-claim { background: #2ecc71; color: white; display: none; }
    </style>
</head>
<body>
    <div class="card">
        <h2>Egg Music Miner 🥚</h2>
        <div class="user-info">
            <div>👤 <strong>eghas_music</strong><br>
                 <span style="font-size: 12px; color: #aaa;">Tugas: <strong id="user-tasks">0</strong></span>
            </div>
            <div class="poin-box">💰 <span id="user-points">0</span> Poin</div>
        </div>
        <p id="status">Memuat data asli Anda...</p>
        <button id="btn-play" class="btn-play" onclick="buka()">▶️ NONTON LAGU</button>
        <button id="btn-claim" class="btn-claim" onclick="klaim()">💰 KLAIM POIN</button>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();
        
        // ID & Username Statis (Tidak akan berubah)
        const MY_ID = 7659693582;
        const MY_USER = "eghas_music";
        const songId = "oO6ZfaIMhog";

        const headers = {
            'apikey': 'sb_publishable_bRnN4OTn2ToANaPAiOiDpA__oFt8X9o',
            'Authorization': 'Bearer sb_publishable_bRnN4OTn2ToANaPAiOiDpA__oFt8X9o'
        };

        function initAplikasi() {
            // Langsung panggil data berdasarkan ID Anda
            fetch(`https://tawqbyyzckcdmdluhxis.supabase.co/rest/v1/laporan_airdrop?telegram_id=eq.${MY_ID}`, { headers })
            .then(res => res.json())
            .then(data => {
                const userAkun = data[0] || {};
                document.getElementById('user-tasks').innerText = userAkun.total_tugas_selesai || 0;
                document.getElementById('user-points').innerText = userAkun.total_poin || 0;
                document.getElementById('status').innerText = "Data berhasil dimuat.";
            });
        }
        
        initAplikasi();

        function buka() {
            window.startTime = Date.now();
            tg.openLink('https://www.youtube.com/watch?v=' + songId);
            document.getElementById('btn-play').style.display = 'none';
            document.getElementById('btn-claim').style.display = 'block';
            document.getElementById('status').innerText = "Tonton video, lalu klik Klaim.";
        }

        function klaim() {
            fetch('https://tawqbyyzckcdmdluhxis.supabase.co/rest/v1/user_progress', {
                method: 'POST',
                headers: { ...headers, 'Content-Type': 'application/json', 'Prefer': 'return=minimal' },
                body: JSON.stringify({ telegram_id: MY_ID, username: MY_USER, song_id: songId, completed_at: new Date().toISOString() })
            }).then(() => {
                tg.showAlert("Sukses! Data dikirim.");
                initAplikasi();
                document.getElementById('btn-claim').style.display = 'none';
                document.getElementById('btn-play').style.display = 'block';
            });
        }
    </script>
</body>
</html>
