<!DOCTYPE html>
<html>
<head>
    <title>Egg Music Miner</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body { font-family: sans-serif; text-align: center; background: #121212; color: white; padding: 20px; }
        #player { border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.5); width: 100%; max-width: 640px; margin: 20px auto; }
        .status { color: #00ff00; margin-top: 10px; }
    </style>
</head>
<body>
    <h2>Egg Music Miner 🥚</h2>
    <p id="user-info">Memuat data user...</p>
    <div id="player"></div>
    <div id="status-db" class="status"></div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();
        const user = tg.initDataUnsafe?.user;
        if (user) { document.getElementById('user-info').innerText = "Mining untuk: " + user.first_name; }

        // Ganti dengan URL & Key dari dashboard Supabase Anda
        const supabase = window.supabase.createClient('https://tawqbyyzckcdmdluhxis.supabase.co', 'sb_publishable_bRnN4OTn2ToANaPAiOiDpA__oFt8X9o');

        var tag = document.createElement('script');
        tag.src = "https://www.youtube.com/iframe_api";
        document.head.appendChild(tag);

        var player;
        function onYouTubeIframeAPIReady() {
            player = new YT.Player('player', {
                height: '360', width: '640', videoId: 'oO6ZfaIMhog',
                events: { 'onStateChange': onPlayerStateChange }
            });
        }

        async function onPlayerStateChange(event) {
            if (event.data == YT.PlayerState.ENDED) {
                document.getElementById('status-db').innerText = "Lagu selesai! Mencatat poin...";
                if (user) {
                    const { error } = await supabase.from('user_progress').insert([{
                        telegram_id: user.id, username: user.username,
                        song_id: 'oO6ZfaIMhog', completed_at: new Date()
                    }]);
                    if (error) alert("Gagal mencatat: " + error.message);
                    else { tg.showAlert("Selamat! Poin berhasil masuk."); tg.close(); }
                }
            }
        }
    </script>
</body>
</html>
