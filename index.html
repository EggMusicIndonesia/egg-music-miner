<!DOCTYPE html>
<html>
<head>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>
<body>
    <h2 id="info">Memuat...</h2>
    <button onclick="buka()">TONTON VIDEO</button>

    <script>
        const tg = window.Telegram.WebApp;
        tg.ready();
        const params = new URLSearchParams(window.location.search);
        const sId = params.get('song_id');
        
        document.getElementById('info').innerText = "Video ID: " + (sId || "Tidak ditemukan");

        function buka() {
            // Kita gunakan replace agar tidak kena cache browser
            const url = 'https://www.youtube.com/watch?v=' + (sId || 'dQw4w9WgXcQ');
            tg.openLink(url);
        }
    </script>
</body>
</html>
