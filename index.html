<!DOCTYPE html>
<html>
<head>
    <title>Egg Music Miner</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body { margin: 0; padding: 0; background: #000; color: white; font-family: sans-serif; text-align: center; }
        iframe { width: 100%; height: 50vh; border: none; }
        .container { padding: 20px; }
        button { background: #2ecc71; color: white; border: none; padding: 15px; border-radius: 10px; width: 80%; font-size: 16px; font-weight: bold; cursor: pointer; margin-top: 20px; }
    </style>
</head>
<body>
    <iframe src="https://www.youtube.com/embed/oO6ZfaIMhog?autoplay=1" allow="autoplay; encrypted-media" allowfullscreen></iframe>
    
    <div class="container">
        <p id="status">Tonton video sampai selesai!</p>
        <button id="claim-btn" onclick="claimPoints()">KLAIM POIN SEKARANG</button>
    </div>
    
    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();
        const supabase = window.supabase.createClient(
            'https://tawqbyyzckcdmdluhxis.supabase.co', 
            'sb_publishable_bRnN4OTn2ToANaPAiOiDpA__oFt8X9o'
        );

        async function claimPoints() {
            const user = tg.initDataUnsafe?.user || { id: 0, username: "guest" };
            document.getElementById('claim-btn').innerText = "Memproses...";
            
            const { error } = await supabase.from('user_progress').insert([{
                telegram_id: user.id, 
                username: user.username || "guest",
                song_id: 'oO6ZfaIMhog', 
                completed_at: new Date().toISOString()
            }]);
            
            if (error) {
                alert("Gagal: " + error.message);
                document.getElementById('claim-btn').innerText = "KLAIM POIN SEKARANG";
            } else {
                document.getElementById('status').innerText = "Sukses! Poin berhasil masuk.";
                document.getElementById('claim-btn').style.display = 'none';
                tg.showAlert("Poin berhasil masuk!");
            }
        }
    </script>
</body>
</html>
