<!DOCTYPE html>
<html>
<head>
    <title>Egg Music Miner</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body { background: #000; color: white; font-family: sans-serif; text-align: center; padding: 20px; }
        .card { background: #1a1a1a; padding: 20px; border-radius: 15px; }
        button { background: #555; color: #ccc; border: none; padding: 15px; border-radius: 10px; width: 100%; font-size: 16px; margin-top: 15px; }
        .active { background: #2ecc71; color: white; cursor: pointer; }
        .play-btn { background: #ff0000; color: white; cursor: pointer; }
    </style>
</head>
<body>
    <div class="card">
        <h2>Egg Music Miner 🥚</h2>
        <p id="status">Memuat data lagu...</p>
        <button class="play-btn" onclick="openVideo()">▶️ NONTON LAGU SEKARANG</button>
        <button id="claim-btn" disabled>TUNGGU DURASI HABIS...</button>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();
        
        const supabase = window.supabase.createClient('https://tawqbyyzckcdmdluhxis.supabase.co', 'sb_publishable_bRnN4OTn2ToANaPAiOiDpA__oFt8X9o');
        const urlParams = new URLSearchParams(window.location.search);
        const songId = urlParams.get('song_id') || 'oO6ZfaIMhog';
        
        // Ambil durasi dari Supabase
        async function loadDuration() {
            const { data } = await supabase.from('tasks').select('duration_seconds').eq('song_id', songId).single();
            return data ? data.duration_seconds : 30; // Default 30 detik
        }

        async function openVideo() {
            tg.openLink(`https://www.youtube.com/watch?v=${songId}`);
            const duration = await loadDuration();
            startTimer(duration);
        }

        function startTimer(duration) {
            let timeLeft = duration;
            const btn = document.getElementById('claim-btn');
            const status = document.getElementById('status');
            
            status.innerText = "Tonton sampai habis untuk menambang...";
            const timer = setInterval(() => {
                timeLeft--;
                if (timeLeft <= 0) {
                    clearInterval(timer);
                    btn.disabled = false;
                    btn.className = 'active';
                    btn.innerText = 'KLAIM POIN SEKARANG';
                    btn.onclick = claimPoints;
                    status.innerText = 'Selesai! Klaim poinmu.';
                } else {
                    btn.innerText = 'TUNGGU ' + timeLeft + ' DETIK...';
                }
            }, 1000);
        }

        async function claimPoints() {
            const user = tg.initDataUnsafe?.user || { id: 0, username: "guest" };
            const { error } = await supabase.from('user_progress').insert([{
                telegram_id: user.id, username: user.username, song_id: songId, completed_at: new Date().toISOString()
            }]);

            if (error) { alert("Gagal: " + error.message); }
            else { tg.showAlert("Sukses! Poin ditambahkan."); tg.close(); }
        }
    </script>
</body>
</html>
