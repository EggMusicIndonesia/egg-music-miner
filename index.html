<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>Egg Music Miner</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body { background: #000; color: #fff; font-family: sans-serif; text-align: center; padding: 20px; }
        .card { background: #1a1a1a; padding: 25px; border-radius: 20px; border: 1px solid #333; }
        button { width: 100%; padding: 18px; border-radius: 12px; border: none; font-size: 16px; margin-top: 15px; font-weight: bold; cursor: pointer; }
        .btn-play { background: #ff0000; color: white; }
        .btn-claim { background: #2ecc71; color: white; display: none; margin-top: 15px; }
    </style>
</head>
<body>
    <div class="card">
        <h2>Egg Music Miner 🥚</h2>
        <p id="status">Klik tombol untuk mulai.</p>
        <button id="btn-play" class="btn-play" onclick="mulai()">▶️ NONTON LAGU</button>
        <button id="btn-claim" class="btn-claim" onclick="klaim()">💰 KLAIM POIN</button>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();
        
        const params = new URLSearchParams(window.location.search);
        const songId = params.get('song_id') || 'oO6ZfaIMhog';
        
        // Timer sederhana tanpa database di awal agar tidak blank
        function mulai() {
            tg.openLink('https://www.youtube.com/watch?v=' + songId);
            document.getElementById('status').innerText = "Mohon tonton video sampai selesai...";
            document.getElementById('btn-play').style.display = 'none';
            
            // Set durasi 30 detik (bisa diubah manual)
            setTimeout(() => {
                document.getElementById('btn-claim').style.display = 'block';
                document.getElementById('status').innerText = "Waktu selesai! Silakan klaim.";
            }, 30000);
        }

        async function klaim() {
            const sb = window.supabase.createClient('https://tawqbyyzckcdmdluhxis.supabase.co', 'sb_publishable_bRnN4OTn2ToANaPAiOiDpA__oFt8X9o');
            const user = tg.initDataUnsafe?.user?.id || 0;
            
            const { error } = await sb.from('user_progress').insert([{telegram_id: user, song_id: songId}]);
            
            if (error) { alert("Error: " + error.message); } 
            else { tg.showAlert("Sukses! Poin ditambahkan."); tg.close(); }
        }
    </script>
</body>
</html>
