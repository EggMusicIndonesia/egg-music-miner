<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body { background: #0b0e14; color: white; text-align: center; font-family: sans-serif; padding: 20px; }
        #action-btn { padding: 15px 30px; font-size: 18px; cursor: pointer; background: #ff9500; border: none; border-radius: 10px; color: white; }
    </style>
</head>
<body>
    <div id="status">Siap mining?</div>
    <audio id="music-player"></audio>
    <button id="action-btn" onclick="startMining()">MULAI TONTON</button>

    <script>
        const tg = window.Telegram.WebApp;
        tg.ready();

        async function startMining() {
            const btn = document.getElementById('action-btn');
            const status = document.getElementById('status');
            const player = document.getElementById('music-player');

            try {
                const res = await fetch('/api', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ 
                        telegram_id: tg.initDataUnsafe?.user?.id || 7659693582, 
                        task_id: 1 
                    })
                });

                const data = await res.json();
                if (data.stream_link) {
                    player.src = data.stream_link;
                    player.play();
                    status.innerText = "Mendengarkan: " + data.title;
                    btn.innerText = "Sedang Berjalan...";
                }
            } catch (e) {
                status.innerText = "Gagal terhubung ke database.";
            }
        }
    </script>
</body>
</html>
