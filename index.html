<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body { background: #0b0e14; color: white; text-align: center; font-family: sans-serif; padding: 20px; }
        #action-btn { 
            padding: 15px 30px; font-size: 18px; cursor: pointer; 
            background: #ff9500; border: none; border-radius: 10px; color: white;
            box-shadow: 0 0 15px #ff9500; transition: 0.3s;
        }
    </style>
</head>
<body>
    <div id="status" style="margin-bottom:20px;">Siap untuk mining koin musik?</div>
    <audio id="music-player"></audio>
    <button id="action-btn" onclick="startTask()">MULAI TONTON</button>

    <script>
        const tg = window.Telegram.WebApp;
        tg.ready();

        async function startTask() {
            const btn = document.getElementById('action-btn');
            const status = document.getElementById('status');
            const player = document.getElementById('music-player');

            status.innerText = "Menghubungkan ke server...";
            
            try {
                // Mengambil data lagu dan mencatat aktivitas ke Supabase
                const res = await fetch('/api', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ 
                        telegram_id: tg.initDataUnsafe?.user?.id || 7659693582, 
                        task_id: 1 
                    })
                });

                const data = await res.json();
                player.src = data.stream_link;
                player.play();
                status.innerText = "Mendengarkan: " + data.title;
                btn.innerText = "Sedang Berjalan...";
            } catch (e) {
                status.innerText = "Error, coba lagi nanti.";
            }
        }
    </script>
</body>
</html>
