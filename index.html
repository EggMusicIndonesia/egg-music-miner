<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>Egg Music Miner</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body { background: #000; color: #fff; font-family: sans-serif; text-align: center; padding: 20px; }
        .card { background: #1a1a1a; padding: 25px; border-radius: 20px; border: 1px solid #333; }
        .user-info { background: #222; padding: 15px; border-radius: 12px; margin-bottom: 20px; border: 1px solid #444; font-size: 14px; text-align: left; display: flex; justify-content: space-between; align-items: center; }
        .user-detail { display: flex; flex-direction: column; gap: 4px; }
        .poin-box { color: #2ecc71; font-weight: bold; font-size: 18px; text-align: right; }
        button { width: 100%; padding: 18px; border-radius: 12px; border: none; font-size: 16px; margin-top: 15px; font-weight: bold; cursor: pointer; }
        .btn-play { background: #ff0000; color: white; }
        .btn-claim { background: #2ecc71; color: white; display: none; }
        button:disabled { opacity: 0.5; cursor: not-allowed; }
    </style>
</head>
<body>
    <div class="card">
        <h2>Egg Music Miner 🥚</h2>
        
        <div class="user-info">
            <div class="user-detail">
                <span>👤 <strong id="user-name">Loading...</strong></span>
                <span style="font-size: 12px; color: #aaa;">Tugas Selesai: <strong id="user-tasks" style="color: #fff;">0</strong></span>
            </div>
            <div class="poin-box">
                💰 <span id="user-points">0</span> <span style="font-size: 12px; color: #2ecc71;">Poin</span>
            </div>
        </div>

        <p id="status">Menghubungkan ke database...</p>
        <button id="btn-play" class="btn-play" onclick="buka()" disabled>Mohon Tunggu...</button>
        <button id="btn-claim" class="btn-claim" onclick="klaim()">💰 KLAIM POIN</button>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();
        
        const params = new URLSearchParams(window.location.search);
        const songId = params.get('song_id') || 'oO6ZfaIMhog';
        
        // SOLUSI AMAN: Deteksi URL, jika kosong atau bernilai '0', paksa gunakan ID asli Anda 7659693582
        const rawUser = params.get('telegram_id') || tg.initDataUnsafe?.user?.id;
        const user = rawUser && rawUser !== '0' && rawUser !== 0 ? parseInt(rawUser) : 7659693582;
        
        const rawUsername = params.get('username') || tg.initDataUnsafe?.user?.username || 'eghas_music';
        const username = String(rawUsername).toLowerCase();

        document.getElementById('user-name').innerText = username;

        function initAplikasi() {
            const urlDurasi = `https://tawqbyyzckcdmdluhxis.supabase.co/rest/v1/tasks?song_id=eq.${songId}&select=duration_seconds`;
            
            // Tembak menggunakan ID murni yang sudah terbukti valid di database Anda
            const urlProgress = `https://tawqbyyzckcdmdluhxis.supabase.co/rest/v1/user_progress?telegram_id=eq.${user}&select=id`;
            
            const headers = {
                'apikey': 'sb_publishable_bRnN4OTn2ToANaPAiOiDpA__oFt8X9o',
                'Authorization': 'Bearer sb_publishable_bRnN4OTn2ToANaPAiOiDpA__oFt8X9o'
            };

            fetch(urlProgress, { headers })
            .then(res => res.json())
            .then(progressData => {
                const totalTugas = progressData ? progressData.length : 0;
                document.getElementById('user-tasks').innerText = totalTugas;
                document.getElementById('user-points').innerText = totalTugas * 100;
            })
            .catch(() => console.log("Gagal memuat history poin"));

            fetch(urlDurasi, { headers })
            .then(res => res.json())
            .then(data => {
                let duration = 30;
                if(data && data.length > 0) {
                    duration = data[0].duration_seconds;
                }
                window.duration = duration;
                document.getElementById('status').innerText = `Tugas: Tonton video selama ${duration} detik.`;
                document.getElementById('btn-play').disabled = false;
                document.getElementById('btn-play').innerText = "▶️ NONTON LAGU";
            });
        }
        
        initAplikasi();

        function buka() {
            window.startTime = Date.now(); 
            tg.openLink('https://www.youtube.com/watch?v=' + songId);
            
            let sisa = window.duration;
            document.getElementById('btn-play').style.display = 'none';
            
            window.timer = setInterval(() => {
                sisa--;
                if (sisa <= 0) {
                    clearInterval(window.timer);
                    document.getElementById('btn-claim').style.display = 'block';
                    document.getElementById('status').innerText = "Waktu selesai! Silakan klaim poin.";
                } else {
                    document.getElementById('status').innerText = `Menambang... Sisa waktu: ${sisa} detik`;
                }
            }, 1000);
        }

        function klaim() {
            const waktuBerlalu = (Date.now() - window.startTime) / 1000;
            if (waktuBerlalu < window.duration) {
                return tg.showAlert("Jangan curang! Selesaikan tontonan Anda.");
            }

            document.getElementById('btn-claim').innerText = "Mengirim...";
            const url = 'https://tawqbyyzckcdmdluhxis.supabase.co/rest/v1/user_progress';

            fetch(url, {
                method: 'POST',
                headers: {
                    'apikey': 'sb_publishable_bRnN4OTn2ToANaPAiOiDpA__oFt8X9o',
                    'Authorization': 'Bearer sb_publishable_bRnN4OTn2ToANaPAiOiDpA__oFt8X9o',
                    'Content-Type': 'application/json',
                    'Prefer': 'return=minimal'
                },
                body: JSON.stringify({ 
                    telegram_id: user,
                    username: username,
                    song_id: songId,
                    completed_at: new Date().toISOString()
                })
            })
            .then(res => {
                if (res.ok) {
                    tg.showAlert("Sukses! 100 Poin ditambahkan.");
                    setTimeout(() => {
                        tg.close();
                    }, 500);
                } else {
                    alert("Gagal menyimpan poin.");
                }
            })
            .catch(() => {
                alert("Terjadi gangguan jaringan ke database.");
            });
        }
    </script>
</body>
</html>
