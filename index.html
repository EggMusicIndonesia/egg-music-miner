<!DOCTYPE html>
<html>
<head>
    <title>Egg Music Miner</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body { background: #000; color: #fff; font-family: sans-serif; text-align: center; padding: 20px; }
        .card { background: #1a1a1a; padding: 20px; border-radius: 15px; border: 1px solid #333; }
        button { width: 100%; padding: 15px; border-radius: 10px; border: none; font-size: 16px; margin-top: 15px; font-weight: bold; }
        .btn-play { background: #ff0000; color: white; }
        .btn-claim { background: #2ecc71; color: white; display: none; }
    </style>
</head>
<body>
    <div class="card">
        <h2>Egg Music Miner 🥚</h2>
        <p id="status">Klik tombol untuk menonton lagu.</p>
        <button class="btn-play" onclick="playVideo()">▶️ NONTON LAGU</button>
        <button id="btn-claim" class="btn-claim" onclick="claim()">💰 KLAIM POIN</button>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();
        
        const urlParams = new URLSearchParams(window.location.search);
        const songId = urlParams.get('song_id') || 'oO6ZfaIMhog';

        function playVideo() {
            // Gunakan openLink untuk membuka YouTube agar tidak diblokir iframe
            tg.openLink(`https://www.youtube.com/watch?v=${songId}`);
            
            // Tampilkan tombol klaim setelah 30 detik (sebagai durasi minimal)
            document.getElementById('status').innerText = "Mohon tonton lagu sampai habis...";
            setTimeout(() => {
                document.getElementById('btn-claim').style.display = 'block';
            }, 30000); 
        }

        async function claim() {
            const supabase = window.supabase.createClient('https://tawqbyyzckcdmdluhxis.supabase.co', 'sb_publishable_bRnN4OTn2ToANaPAiOiDpA__oFt8X9o');
            const user = tg.initDataUnsafe?.user || { id: 0, username: "guest" };
            
            const { error } = await supabase.from('user_progress').insert([{
                telegram_id: user.id, username: user.username, song_id: songId, completed_at: new Date().toISOString()
            }]);

            if (error) { alert("Error: " + error.message); }
            else { tg.showAlert("Sukses! Poin masuk."); tg.close(); }
        }
    </script>
</body>
</html>
