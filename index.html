<!DOCTYPE html>
<html>
<head>
    <title>Egg Music Miner</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body { font-family: sans-serif; text-align: center; background: #121212; color: white; padding: 20px; }
        .song-card { background: #1e1e1e; padding: 20px; margin: 20px auto; border-radius: 15px; max-width: 300px; }
        button { background: #ff0000; color: white; border: none; padding: 15px 30px; border-radius: 10px; cursor: pointer; font-size: 16px; font-weight: bold; }
    </style>
</head>
<body>
    <h2>Egg Music Miner 🥚</h2>
    <p>Klik di bawah untuk mendengarkan lagu dan menambang!</p>
    
    <div class="song-card">
        <p>Surat Yang Tak Sampai</p>
        <button onclick="window.Telegram.WebApp.openLink('https://www.youtube.com/watch?v=oO6ZfaIMhog', {try_instant_view: true})">
            DENGARKAN
        </button>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();
    </script>
</body>
</html>
