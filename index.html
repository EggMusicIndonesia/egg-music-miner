<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Egg Player</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body { background: #121212; color: white; font-family: sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; margin: 0; }
        button { padding: 15px 30px; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; }
    </style>
</head>
<body>
    <h2 id="msg">Memuat Player...</h2>
    <button id="btn" style="background: #007bff; color: white; display: none;" onclick="buka()">TONTON VIDEO</button>

    <script>
        const tg = window.Telegram.WebApp;
        tg.ready();
        
        const params = new URLSearchParams(window.location.search);
        const songId = params.get('song_id');

        if(songId) {
            document.getElementById('msg').innerText = "Tugas Siap Dimulai!";
            document.getElementById('btn').style.display = "block";
        } else {
            document.getElementById('msg').innerText = "ID Lagu Tidak Ditemukan.";
        }

        function buka() {
            tg.openLink('https://www.youtube.com/watch?v=' + songId);
        }
    </script>
</body>
</html>
