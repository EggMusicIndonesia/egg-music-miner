<!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body { margin: 0; padding: 20px; font-family: sans-serif; background: #1a1a1a; color: white; text-align: center; }
        #video-container { width: 100%; height: 200px; background: #000; margin-bottom: 20px; }
    </style>
</head>
<body>

    <div id="video-container">
        <div id="player"></div>
    </div>

    <button id="btn-klaim" disabled style="padding: 15px 30px; font-size: 18px; background: #6c757d; color: white; border: none; border-radius: 8px; width: 100%;">
        ⏳ Tunggu Video Selesai...
    </button>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();
        
        const supabase = supabase.createClient('URL_SUPABASE_ANDA', 'KEY_SUPABASE_ANDA');
        const params = new URLSearchParams(window.location.search);
        const songId = params.get('song_id') || 'dQw4w9WgXcQ'; // Ganti default jika perlu
        const userId = params.get('telegram_id');

        // Load YouTube IFrame API
        var tag = document.createElement('script');
        tag.src = "https://www.youtube.com/iframe_api";
        var firstScriptTag = document.getElementsByTagName('script')[0];
        firstScriptTag.parentNode.insertBefore(tag, firstScriptTag);

        var player;
        function onYouTubeIframeAPIReady() {
            player = new YT.Player('player', {
                height: '200',
                width: '100%',
                videoId: songId,
                events: { 'onStateChange': onPlayerStateChange }
            });
        }

        function onPlayerStateChange(event) {
            // 0 = Ended (Video Selesai)
            if (event.data === 0) {
                const btn = document.getElementById('btn-klaim');
                btn.disabled = false;
                btn.style.background = "#28a745";
                btn.innerText = "✅ KLAIM POIN";
                btn.onclick = tandaiSelesai;
            }
        }

        async function tandaiSelesai() {
            const { error } = await supabase
                .from('user_progress')
                .insert([{ telegram_id: userId, song_id: songId, status: 'selesai' }]);

            if (error) {
                alert("Gagal: " + error.message);
            } else {
                alert("Tugas Selesai! Poin tersimpan.");
                tg.close();
            }
        }
    </script>
</body>
</html>
