<div id="player-container" style="display:none; margin-top: 20px;">
    <iframe id="youtube-embed" width="100%" height="200" src="" frameborder="0" allowfullscreen></iframe>
    <button onclick="tandaiSelesai()" style="background: #28a745;">✅ TANDAI SELESAI</button>
</div>

<script>
    const tg = window.Telegram.WebApp;
    tg.expand();
    const params = new URLSearchParams(window.location.search);
    const songId = params.get('song_id');
    
    // Tampilkan tombol putar
    function buka() {
        if (!songId) return alert("ID Lagu tidak ditemukan!");
        
        // Sembunyikan tombol, tampilkan iframe
        document.getElementById('btn-play').style.display = 'none';
        document.getElementById('player-container').style.display = 'block';
        
        // Masukkan URL YouTube ke iframe
        document.getElementById('youtube-embed').src = 'https://www.youtube.com/embed/' + songId + '?autoplay=1';
    }

    function tandaiSelesai() {
        // Logika kirim ke Supabase
        alert("Tugas selesai! (Integrasikan API Supabase Anda di sini)");
    }
</script>
