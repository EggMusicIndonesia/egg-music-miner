<!DOCTYPE html>
<html>
<head>
    <title>Egg Music Miner</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body { background: #000; color: #fff; font-family: sans-serif; text-align: center; padding: 20px; }
        .card { background: #1a1a1a; padding: 20px; border-radius: 15px; border: 1px solid #333; }
        button { width: 100%; padding: 15px; border-radius: 10px; border: none; font-size: 16px; margin-top: 15px; font-weight: bold; }
        .btn-play { background: #ff0000; color: white; cursor: pointer; }
        .btn-claim { background: #555; color: #ccc; display: none; }
        .btn-claim.active { background: #2ecc71; color: white; cursor: pointer; }
    </style>
</head>
<body>
    <div class="card">
        <h2>Egg Music Miner 🥚</h2>
        <p id="status">Klik tombol untuk menonton lagu.</p>
        <button class="btn-play" onclick="initMining()">▶️ NONTON LAGU</button>
        <button id="btn-claim" class="btn-claim" onclick="claim()">💰 KLAIM POIN</button>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();
        
        const supabase = window.supabase.createClient('https://tawqbyyzckcdmdluhxis.supabase.co', 'sb_publishable_bRnN4OTn2ToANaPAiOiDpA__oFt8X9o');
        const urlParams = new URLSearchParams(window.location.search);
        const songId = urlParams.get('song_id') || 'oO6ZfaIMhog';

        async function initMining() {
            // 1. Ambil durasi dari Supabase berdasarkan songId
            const { data } = await supabase.from('tasks').select('duration_seconds').eq('url', `https://www.youtube.com/watch?v=${songId}`).single();
            const duration = data ? data.duration_seconds : 30; // Default 30 jika tidak ketemu

            // 2. Buka Link
            tg.openLink(`https://www.youtube.com/watch?v=${songId}`);

            // 3. Jalankan Timer sesuai durasi
            startTimer(duration);
        }

        function startTimer(seconds) {
            const btn = document.getElementById('btn-claim');
            const status = document.getElementById('status');
            
            btn.style.display = 'block';
            btn.disabled = true;
            btn.innerText = `MENUNGGU ${seconds} DETIK...`;
            status.innerText = "Jangan tutup aplikasi, tonton sampai habis!";

            let timeLeft = seconds;
            const timer = setInterval(() => {
                timeLeft--;
                if (timeLeft <= 0) {
                    clearInterval(timer);
                    btn.disabled = false;
                    btn.className = 'btn-claim active';
                    btn.innerText = '💰 KLAIM POIN SEKARANG';
                    status.innerText = 'Durasi selesai! Silakan klaim.';
                } else {
                    btn.innerText = `MENUNGGU ${timeLeft} DETIK...`;
                }
            }, 1000);
        }

        async function claim() {
            const user = tg.initDataUnsafe?.user || { id: 0, username: "guest" };
            const { error } = await supabase.from('user_progress').insert([{
                telegram_id: user.id, username: user.username, song_id: songId, completed_at: new Date().toISOString()
            }]);

            if (error) { alert("Error: " + error.message); }
            else { tg.showAlert("Sukses! Poin masuk."); tg.close(); }
        }
    </script>
</body>
</html>
