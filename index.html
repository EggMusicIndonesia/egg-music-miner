<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Egg Music Miner</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body { text-align: center; font-family: sans-serif; }
        #yt-player { width: 100%; height: 200px; display: none; }
    </style>
</head>
<body>
    <h1>Egg Music Miner</h1>
    <iframe id="yt-player" src="" frameborder="0" allow="autoplay"></iframe>
    <div id="status">Klik tombol untuk mulai mining!</div>
    <button id="btn" onclick="startMining()">▶️ MULAI MINING</button>

    <script>
        const tg = window.Telegram.WebApp;
        tg.ready();

        async function startMining() {
            const userId = tg.initDataUnsafe?.user?.id;
            const player = document.getElementById('yt-player');
            const status = document.getElementById('status');

            // 1. Tampilkan player dan set video
            player.style.display = 'block';
            player.src = "https://www.youtube.com/embed/dQw4w9WgXcQ?autoplay=1";
            status.innerText = "Mining berjalan... tunggu 30 detik.";

            // 2. Kirim data saldo ke server
            await fetch('/api', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ telegram_id: userId })
            });

            // 3. Countdown sederhana
            let count = 30;
            const timer = setInterval(() => {
                count--;
                status.innerText = "Mining berjalan... sisa " + count + " detik.";
                if (count <= 0) {
                    clearInterval(timer);
                    status.innerText = "Mining Selesai! Saldo +10.";
                    player.style.display = 'none';
                }
            }, 1000);
        }
    </script>
</body>
</html>
