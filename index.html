<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>Egg Music Miner</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body { background: #000; color: #fff; font-family: sans-serif; text-align: center; padding: 20px; }
        .card { background: #1a1a1a; padding: 25px; border-radius: 20px; border: 1px solid #333; }
        button { width: 100%; padding: 18px; border-radius: 12px; border: none; font-size: 16px; margin-top: 15px; font-weight: bold; cursor: pointer; }
        .btn-play { background: #ff0000; color: white; }
        .btn-claim { background: #2ecc71; color: white; display: none; }
        button:disabled { opacity: 0.5; cursor: not-allowed; }
    </style>
</head>
<body>
    <div class="card">
        <h2>Egg Music Miner 🥚</h2>
        <p id="status">Menghubungkan ke server...</p>
        <button id="btn-play" class="btn-play" onclick="buka()" disabled>Mohon Tunggu...</button>
        <button id="btn-claim" class="btn-claim" onclick="klaim()">💰 KLAIM POIN</button>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();
        
        const params = new URLSearchParams(window.location.search);
        const songId = params.get('song_id') || 'oO6ZfaIMhog';
        
        let duration = 30; // Cadangan jika DB offline
        let startTime = 0;

        // Ambil durasi asli secara dinamis dari tabel tasks menggunakan REST API langsung
        function ambilDurasi() {
            const url = `https://tawqbyyzckcdmdluhxis.supabase.co/rest/v1/tasks?song_id=eq.${songId}&select=duration_seconds`;
            
            fetch(url, {
                headers: {
                    'apikey': 'sb_publishable_bRnN4OTn2ToANaPAiOiDpA__oFt8X9o',
                    'Authorization': 'Bearer sb_publishable_bRnN4OTn2ToANaPAiOiDpA__oFt8X9o'
                }
            })
            .then(res => res.json())
            .then(data => {
                if(data && data.length > 0) {
                    duration = data[0].duration_seconds;
                }
                document.getElementById('status').innerText = `Tugas: Tonton lagu ini selama ${duration} detik.`;
                document.getElementById('btn-play').disabled = false;
                document.getElementById('btn-play').innerText = "▶️ NONTON LAGU";
            })
            .catch(() => {
                document.getElementById('status').innerText = "Menggunakan durasi standar (30 detik).";
                document.getElementById('btn-play').disabled = false;
                document.getElementById('btn-play').innerText = "▶️ NONTON LAGU";
            });
        }
        
        ambilDurasi();

        function buka() {
            startTime = Date.now(); // Kunci waktu mulai menonton
            tg.openLink('https://www.youtube.com/watch?v=' + songId);
            
            let sisa = duration;
            document.getElementById('btn-play').style.display = 'none';
            
            const timer = setInterval(() => {
                sisa--;
                if (sisa <= 0) {
                    clearInterval(timer);
                    document.getElementById('btn-claim').style.display = 'block';
                    document.getElementById('status').innerText = "Waktu selesai! Silakan klaim poin Anda.";
                } else {
                    document.getElementById('status').innerText = `Menambang... Sisa waktu: ${sisa} detik`;
                }
            }, 1000);
        }

        function klaim() {
            // Validasi Anti-Cheat: Hitung apakah waktu tunggu di aplikasi benar-benar valid
            const waktuBerlalu = (Date.now() - startTime) / 1000;
            if (waktuBerlalu < duration) {
                return tg.showAlert("Jangan curang! Anda harus menonton video sampai selesai.");
            }

            document.getElementById('btn-claim').innerText = "Mengirim...";
            const url = 'https://tawqbyyzckcdmdluhxis.supabase.co/rest/v1/user_progress';
            const user = tg.initDataUnsafe?.user?.id || 0;
            const username = tg.initDataUnsafe?.user?.username || 'guest';

            fetch(url, {
                method: 'POST',
                headers: {
                    'apikey': 'sb_publishable_bRnN4OTn2ToANaPAiOiDpA__oFt8X9o',
                    'Authorization': 'Bearer sb_publishable_bRnN4OTn2ToANaPAiOiDpA__oFt8X9o',
                    'Content-Type': 'application/json',
                    'Prefer': 'return=minimal'
                },
                body: JSON.stringify({ 
                    telegram_id: user, 
                    username: username,
                    song_id: songId,
                    completed_at: new Date().toISOString()
                })
            })
            .then(res => {
                if (res.ok) {
                    tg.showAlert("Sukses! Poin berhasil masuk ke database.");
                } else {
                    alert("Gagal menyimpan poin. Hubungi admin.");
                }
            })
            .finally(() => tg.close());
        }
    </script>
</body>
</html>
