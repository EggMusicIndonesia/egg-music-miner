<!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body { background-color: #1a1a1a; color: white; text-align: center; font-family: sans-serif; padding: 30px; }
        button { padding: 15px 30px; width: 100%; border: none; border-radius: 10px; font-size: 18px; font-weight: bold; margin-top: 20px; cursor: pointer; }
    </style>
</head>
<body>
    <h2>Egg Music Player</h2>
    <p>Silakan klik tombol di bawah untuk mulai menonton.</p>
    
    <button id="btn-tonton" style="background: #007bff; color: white;" onclick="buka()">
        ▶️ MULAI TONTON
    </button>
    
    <button id="btn-klaim" style="background: #28a745; color: white; display: none;" disabled onclick="klaim()">
        ✅ KLAIM POIN
    </button>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();
        
        // Kredensial Anda (Sudah dimasukkan)
        const supabase = supabase.createClient(
            'https://tawqbyyzckcdmdluhxis.supabase.co', 
            'sb_publishable_bRnN4OTn2ToANaPAiOiDpA__oFt8X9o'
        );
        
        const params = new URLSearchParams(window.location.search);
        const songId = params.get('song_id') || 'dQw4w9WgXcQ';
        const userId = params.get('telegram_id');

        function buka() {
            tg.openLink('https://www.youtube.com/watch?v=' + songId);
            document.getElementById('btn-tonton').style.display = 'none';
            document.getElementById('btn-klaim').style.display = 'block';
            
            let detik = 30;
            let timer = setInterval(() => {
                detik--;
                document.getElementById('btn-klaim').innerText = "⏳ Tunggu " + detik + "s";
                if(detik <= 0) {
                    clearInterval(timer);
                    document.getElementById('btn-klaim').innerText = "✅ KLAIM POIN";
                    document.getElementById('btn-klaim').disabled = false;
                }
            }, 1000);
        }

        async function klaim() {
            if (!userId) return alert("User ID tidak terdeteksi!");
            const { error } = await supabase
                .from('user_progress')
                .insert([{ telegram_id: userId, song_id: songId, status: 'selesai' }]);
            
            if (error) { alert("Error: " + error.message); }
            else { alert("Poin berhasil ditambahkan!"); tg.close(); }
        }
    </script>
</body>
</html>
