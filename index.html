<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>Egg Music Miner</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body { background: #000; color: #fff; font-family: sans-serif; text-align: center; padding: 20px; }
        .card { background: #1a1a1a; padding: 25px; border-radius: 20px; border: 1px solid #333; }
        button { width: 100%; padding: 18px; border-radius: 12px; border: none; font-size: 16px; font-weight: bold; cursor: pointer; margin-top: 10px; }
        .btn-play { background: #ff0000; color: white; }
    </style>
</head>
<body>
    <div class="card">
        <h2>Egg Music Miner 🥚</h2>
        <p id="status">Memuat data...</p>
        <button id="btn-play" class="btn-play" onclick="buka()">▶️ NONTON LAGU</button>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();
        const params = new URLSearchParams(window.location.search);
        const songId = params.get('song_id');
        const user = tg.initDataUnsafe?.user || { id: 12345 }; // Default ID untuk test

        // Fungsi untuk buka YouTube
        function buka() {
            tg.openLink('https://www.youtube.com/watch?v=' + songId);
            // Setelah nonton, user balik dan klik "Klaim"
            document.getElementById('status').innerHTML = '<button onclick="klaim()" style="background:#2ecc71">💰 KLAIM POIN</button>';
        }

        // Fungsi klaim ke Supabase
        async function klaim() {
            const res = await fetch('https://tawqbyyzckcdmdluhxis.supabase.co/rest/v1/user_progress', {
                method: 'POST',
                headers: {
                    'apikey': 'sb_publishable_bRnN4OTn2ToANaPAiOiDpA__oFt8X9o',
                    'Authorization': 'Bearer sb_publishable_bRnN4OTn2ToANaPAiOiDpA__oFt8X9o',
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({ telegram_id: user.id, song_id: songId })
            });
            if(res.ok) {
                alert("Berhasil!");
                tg.close();
            }
        }
        document.getElementById('status').innerText = "Siap menambang!";
    </script>
</body>
</html>
