<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>Egg Music Miner</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body { background: #000; color: #fff; font-family: sans-serif; text-align: center; padding: 20px; }
        .card { background: #1a1a1a; padding: 25px; border-radius: 20px; border: 1px solid #333; }
        button { width: 100%; padding: 18px; border-radius: 12px; border: none; font-size: 16px; font-weight: bold; cursor: pointer; margin-top: 10px; }
        .btn-play { background: #ff0000; color: white; }
    </style>
</head>
<body>
    <div class="card">
        <h2>Egg Music Miner 🥚</h2>
        <p id="song-title">Memuat lagu...</p>
        <button id="btn-play" class="btn-play" onclick="buka()">▶️ TONTON SEKARANG</button>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();
        
        // Mengambil ID lagu dari URL yang dikirim bot
        const params = new URLSearchParams(window.location.search);
        const songId = params.get('song_id');
        
        document.getElementById('song-title').innerText = "ID Lagu: " + songId;

        function buka() {
            if (!songId) return alert("ID Lagu tidak ditemukan!");
            window.open('https://www.youtube.com/watch?v=' + songId, '_blank');
        }
    </script>
</body>
</html>
