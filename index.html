<!DOCTYPE html>
<html>
<head>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>
<body style="padding:20px; font-family:sans-serif;">
    <h2 id="info">Mengecek ID...</h2>
    <button onclick="buka()" style="padding:15px; width:100%;">TONTON VIDEO</button>

    <script>
        const tg = window.Telegram.WebApp;
        tg.ready();
        
        // Mengambil parameter dari URL
        const params = new URLSearchParams(window.location.search);
        const sId = params.get('song_id');
        
        // Debugging: Menampilkan ID yang terbaca di layar
        document.getElementById('info').innerText = sId ? "ID Terbaca: " + sId : "ID GAGAL TERBACA!";

        function buka() {
            if (!sId) {
                alert("URL tidak mengandung ?song_id=... (Bot mengirim ID yang salah)");
                return;
            }
            tg.openLink('https://www.youtube.com/watch?v=' + sId);
        }
    </script>
</body>
</html>
