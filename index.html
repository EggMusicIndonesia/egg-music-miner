<!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>
<body style="text-align: center; padding: 20px; font-family: sans-serif;">

    <div id="player-container">
        <button id="btn-play" onclick="buka()" style="padding: 15px 30px; font-size: 18px; background: #007bff; color: white; border: none; border-radius: 8px;">
            ▶️ TONTON VIDEO
        </button>

        <button id="btn-selesai" onclick="tandaiSelesai()" style="display:none; padding: 15px 30px; font-size: 18px; background: #28a745; color: white; border: none; border-radius: 8px; margin-top: 20px;">
            ✅ TANDAI SELESAI
        </button>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();
        
        const params = new URLSearchParams(window.location.search);
        const songId = params.get('song_id');

        function buka() {
            if (!songId) return alert("ID Lagu tidak ditemukan!");
            
            // Membuka YouTube di browser asli HP agar tidak kena blokir iframe
            tg.openLink('https://www.youtube.com/watch?v=' + songId);
            
            // Tampilkan tombol selesai setelah user klik buka
            document.getElementById('btn-play').style.display = 'none';
            document.getElementById('btn-selesai').style.display = 'inline-block';
        }

        function tandaiSelesai() {
            // Ganti alert ini dengan kode untuk kirim data ke Supabase Anda
            alert("Tugas selesai! (Integrasikan API Supabase di sini)");
        }
    </script>
</body>
</html>
