<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Egg Music Player</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body { background: #1a1a1a; color: white; font-family: sans-serif; text-align: center; padding: 20px; }
        button { padding: 15px 30px; border: none; border-radius: 10px; font-size: 16px; font-weight: bold; cursor: pointer; width: 100%; margin-top: 20px; }
    </style>
</head>
<body>
    <h2 id="status">Siap digunakan</h2>
    <button id="btn-tonton" style="background: #007bff; color: white;" onclick="mulai()">▶️ MULAI TONTON</button>
    <button id="btn-klaim" style="background: #28a745; color: white; display: none;" disabled>✅ KLAIM POIN</button>

    <script>
        // Paksa inisialisasi
        const tg = window.Telegram.WebApp;
        tg.expand();
        
        document.getElementById('status').innerText = "Silakan klik tombol di bawah:";

        function mulai() {
            // Gunakan link yang jelas
            tg.openLink('https://www.youtube.com/watch?v=dQw4w9WgXcQ');
            
            document.getElementById('btn-tonton').style.display = 'none';
            document.getElementById('btn-klaim').style.display = 'block';
            
            let sisa = 30;
            let timer = setInterval(() => {
                sisa--;
                document.getElementById('btn-klaim').innerText = "⏳ Tunggu " + sisa + " detik";
                if(sisa <= 0) {
                    clearInterval(timer);
                    document.getElementById('btn-klaim').innerText = "✅ KLAIM POIN";
                    document.getElementById('btn-klaim').disabled = false;
                    document.getElementById('btn-klaim').onclick = function() {
                        alert("Poin ditambahkan!");
                        tg.close();
                    };
                }
            }, 1000);
        }
    </script>
</body>
</html>
