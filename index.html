<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body { background: #0b0e14; color: white; text-align: center; font-family: sans-serif; padding: 20px; }
        button { padding: 15px 30px; font-size: 18px; cursor: pointer; background: #ff9500; border: none; border-radius: 10px; color: white; }
    </style>
</head>
<body>
    <div id="status" style="margin-bottom:20px;">Siap untuk mining koin musik?</div>
    
    <audio id="music-player" src="https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3"></audio>

    <button id="action-btn" onclick="startTask()">MULAI TONTON</button>

    <script>
        const tg = window.Telegram.WebApp;
        tg.ready();
        
        const telegramId = tg.initDataUnsafe?.user?.id || 7659693582;
        const taskId = 1; // Sesuaikan dengan ID lagu di Supabase Anda

        async function startTask() {
            const btn = document.getElementById('action-btn');
            const status = document.getElementById('status');
            const player = document.getElementById('music-player');

            status.innerText = "Menghubungkan ke server...";
            btn.disabled = true;

            try {
                const res = await fetch('https://project-g1fby.vercel.app/api/index', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ telegram_id: telegramId, task_id: taskId })
                });

                if (res.ok) {
                    status.innerText = "Lagu dimulai! Mendengarkan...";
                    player.play(); // Memicu pemutaran lagu otomatis
                    btn.innerText = "Sedang Mendengarkan...";
                } else {
                    const err = await res.json();
                    status.innerText = "Eror: " + err.message;
                    btn.disabled = false;
                }
            } catch (e) {
                status.innerText = "Koneksi Gagal: " + e.message;
                btn.disabled = false;
            }
        }
    </script>
</body>
</html>
