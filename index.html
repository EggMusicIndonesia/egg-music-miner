<script>
    const tg = window.Telegram.WebApp;
    tg.expand();

    // Pastikan library supabase sudah dimuat sebelum ini
    // Ganti URL dan KEY dengan milik Anda dari Dashboard Supabase
    const supabase = supabase.createClient('URL_SUPABASE_ANDA', 'KEY_SUPABASE_ANDA');
    
    const params = new URLSearchParams(window.location.search);
    const songId = params.get('song_id');
    const userId = params.get('telegram_id');

    async function buka() {
        if (!songId) return alert("ID Lagu tidak ditemukan!");

        // Ambil durasi
        const { data: task, error } = await supabase
            .from('tasks')
            .select('duration')
            .eq('song_id', songId)
            .single();

        const duration = (task && task.duration) ? task.duration : 30;

        tg.openLink('https://www.youtube.com/watch?v=' + songId);
        
        document.getElementById('btn-play').style.display = 'none';
        const btnSelesai = document.getElementById('btn-selesai');
        btnSelesai.style.display = 'inline-block';
        btnSelesai.disabled = true;
        btnSelesai.innerText = "⏳ Menunggu (" + duration + "s)";

        let timeLeft = duration;
        let timer = setInterval(() => {
            timeLeft--;
            btnSelesai.innerText = "⏳ Menunggu (" + timeLeft + "s)";
            if (timeLeft <= 0) {
                clearInterval(timer);
                btnSelesai.disabled = false;
                btnSelesai.innerText = "✅ TANDAI SELESAI";
                btnSelesai.style.background = "#28a745";
            }
        }, 1000);
    }

    async function tandaiSelesai() {
        if (!userId) return alert("User ID tidak terbaca!");
        
        const { error } = await supabase
            .from('user_progress')
            .insert([{ telegram_id: userId, song_id: songId, status: 'selesai' }]);

        if (error) {
            alert("Gagal menyimpan: " + error.message);
        } else {
            alert("Tugas berhasil diselesaikan!");
            tg.close();
        }
    }
</script>
