<!DOCTYPE html>
<html>
<head>
    <title>Egg Music Miner</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body { background: #000; color: #fff; font-family: sans-serif; text-align: center; padding: 20px; }
        .card { background: #1a1a1a; padding: 20px; border-radius: 15px; border: 1px solid #333; }
        button { width: 100%; padding: 15px; border-radius: 10px; border: none; font-size: 16px; margin-top: 15px; font-weight: bold; cursor: pointer; }
        .btn-play { background: #ff0000; color: white; }
        .btn-claim { background: #555; color: #ccc; display: none; }
        .btn-claim.active { background: #2ecc71; color: white; }
    </style>
</head>
<body>
    <div class="card">
        <h2>Egg Music Miner 🥚</h2>
        <p id="status">Klik tombol di bawah untuk mulai.</p>
        <button class="btn-play" onclick="mulaiTugas()">▶️ NONTON LAGU</button>
        <button id="btn-claim" class="btn-claim" onclick="klaimPoin()">💰 KLAIM POIN</button>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();
        const urlParams = new URLSearchParams(window.location.search);
        const songId = urlParams.get('song_id') || 'oO6ZfaIMhog';

        function mulaiTugas() {
            // 1. Langsung buka link tanpa menunggu database
            tg.openLink(`https://www.youtube.com/watch?v=${songId}`);
            
            // 2. Set durasi statis 30 detik untuk keamanan agar aplikasi tidak macet
            // Database tetap ada di background jika Anda ingin melakukan audit
            document.getElementById('status').innerText = "Mohon tonton video selama 30 detik...";
            
            setTimeout(() => {
                const btn = document.getElementById('btn-claim');
                btn.style.display = 'block';
                btn.className = 'btn-claim active';
                document.getElementById('status').innerText = "Selesai! Klik klaim sekarang.";
            }, 30000);
        }

        async function klaimPoin() {
            const supabase = window.supabase.createClient('https://tawqbyyzckcdmdluhxis.supabase.co', 'sb_publishable_bRnN4OTn2ToANaPAiOiDpA__oFt8X9o');
            const user = tg.initDataUnsafe?.user || { id: 0, username: "guest" };
            
            document.getElementById('btn-claim').innerText = "Mengirim...";
            
            const { error } = await supabase.from('user_progress').insert([{
                telegram_id: user.id, username: user.username, song_id: songId, completed_at: new Date().toISOString()
            }]);

            if (error) { 
                alert("Gagal: " + error.message); 
                document.getElementById('btn-claim').innerText = "💰 KLAIM POIN";
            } else { 
                tg.showAlert("Sukses! Poin berhasil masuk."); 
                tg.close(); 
            }
        }
    </script>
</body>
</html>
