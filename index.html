<!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body { background: #1a1a1a; color: white; text-align: center; font-family: sans-serif; padding: 20px; }
        .btn { padding: 15px; width: 100%; border: none; border-radius: 8px; font-size: 16px; margin-top: 10px; cursor: pointer; }
    </style>
</head>
<body>
    <h3>Player Tugas</h3>
    <p>Tekan tombol di bawah untuk mulai menonton.</p>
    
    <button id="btn-start" class="btn" style="background:#007bff; color:white;" onclick="bukaYouTube()">
        ▶️ TONTON VIDEO
    </button>
    
    <button id="btn-klaim" class="btn" style="background:#6c757d; color:white; display:none;" disabled onclick="klaimPoin()">
        ✅ KLAIM POIN
    </button>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();
        
        // Ganti dengan kredensial Supabase Anda
        const supabase = supabase.createClient('URL_SUPABASE_ANDA', 'KEY_SUPABASE_ANDA');
        const params = new URLSearchParams(window.location.search);
        const songId = params.get('song_id');
        const userId = params.get('telegram_id');

        function bukaYouTube() {
            // Membuka YouTube di luar Telegram (aman dari blokir)
            tg.openLink('https://www.youtube.com/watch?v=' + songId);
            
            // Tampilkan tombol klaim setelah 30 detik (timer sederhana)
            document.getElementById('btn-start').style.display = 'none';
            document.getElementById('btn-klaim').style.display = 'block';
            
            let waktu = 30;
            let interval = setInterval(() => {
                waktu--;
                document.getElementById('btn-klaim').innerText = "⏳ Tunggu (" + waktu + "s)";
                if(waktu <= 0) {
                    clearInterval(interval);
                    document.getElementById('btn-klaim').innerText = "✅ KLAIM POIN";
                    document.getElementById('btn-klaim').style.background = "#28a745";
                    document.getElementById('btn-klaim').disabled = false;
                }
            }, 1000);
        }

        async function klaimPoin() {
            const { error } = await supabase
                .from('user_progress')
                .insert([{ telegram_id: userId, song_id: songId, status: 'selesai' }]);
            
            if (error) { alert("Gagal: " + error.message); }
            else { alert("Poin masuk!"); tg.close(); }
        }
    </script>
</body>
</html>
