<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>Egg Music Miner</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body { background: #000; color: #fff; font-family: sans-serif; text-align: center; padding: 20px; }
        .card { background: #1a1a1a; padding: 25px; border-radius: 20px; border: 1px solid #333; }
        button { width: 100%; padding: 18px; border-radius: 12px; border: none; font-size: 16px; font-weight: bold; cursor: pointer; margin-top: 10px; }
        .btn-play { background: #ff0000; color: white; }
        .btn-claim { background: #2ecc71; color: white; display: none; }
    </style>
</head>
<body>
    <div class="card">
        <h2>Egg Music Miner 🥚</h2>
        <p id="status">Memeriksa status lagu...</p>
        <button id="btn-play" class="btn-play" onclick="buka()">▶️ NONTON LAGU</button>
        <button id="btn-claim" class="btn-claim" onclick="klaim()">💰 KLAIM POIN</button>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();
        const params = new URLSearchParams(window.location.search);
        const songId = params.get('song_id');
        const user = tg.initDataUnsafe?.user || { id: 0 };
        const headers = { 'apikey': 'sb_publishable_bRnN4OTn2ToANaPAiOiDpA__oFt8X9o', 'Authorization': 'Bearer sb_publishable_bRnN4OTn2ToANaPAiOiDpA__oFt8X9o', 'Content-Type': 'application/json' };

        async function init() {
            // Cek apakah user sudah pernah mengerjakan songId ini
            const res = await fetch(`https://tawqbyyzckcdmdluhxis.supabase.co/rest/v1/user_progress?telegram_id=eq.${user.id}&song_id=eq.${songId}`, { headers });
            const data = await res.json();
            
            if (data.length > 0) {
                document.getElementById('status').innerText = "Tugas ini sudah selesai!";
                document.getElementById('btn-play').style.display = 'none';
            } else {
                document.getElementById('status').innerText = "Tonton lagu untuk menambang!";
            }
        }

        function buka() {
            tg.openLink('https://www.youtube.com/watch?v=' + songId);
            document.getElementById('btn-play').style.display = 'none';
            document.getElementById('btn-claim').style.display = 'block';
        }

        async function klaim() {
            document.getElementById('status').innerText = "Menyimpan...";
            await fetch('https://tawqbyyzckcdmdluhxis.supabase.co/rest/v1/user_progress', {
                method: 'POST', headers,
                body: JSON.stringify({ telegram_id: user.id, song_id: songId, last_complete: new Date().toISOString() })
            });
            tg.close(); // Tutup WebApp otomatis setelah klaim
        }
        init();
    </script>
</body>
</html>
