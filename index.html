<!DOCTYPE html>
<html>
<head>
    <title>Egg Music Miner</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body { background: #000; color: #fff; font-family: sans-serif; text-align: center; padding: 20px; }
        .card { background: #1a1a1a; padding: 20px; border-radius: 15px; border: 1px solid #333; }
        button { width: 100%; padding: 15px; border-radius: 10px; border: none; font-size: 16px; margin-top: 15px; font-weight: bold; cursor: pointer; }
        .btn-play { background: #ff0000; color: white; }
        .btn-claim { background: #2ecc71; color: white; display: none; }
    </style>
</head>
<body>
    <div class="card">
        <h2>Egg Music Miner 🥚</h2>
        <p id="status">Memuat lagu...</p>
        <button class="btn-play" onclick="mulaiNonton()">▶️ NONTON LAGU</button>
        <button id="btn-claim" class="btn-claim" onclick="klaim()">💰 KLAIM POIN</button>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();
        
        const sb = window.supabase.createClient('https://tawqbyyzckcdmdluhxis.supabase.co', 'sb_publishable_bRnN4OTn2ToANaPAiOiDpA__oFt8X9o');
        const params = new URLSearchParams(window.location.search);
        const songId = params.get('song_id') || 'oO6ZfaIMhog';
        
        let durasiLagu = 30; // Default

        // 1. Ambil data saat halaman dimuat (bukan saat tombol diklik)
        async function init() {
            const { data } = await sb.from('tasks').select('duration_seconds').like('url', `%${songId}%`).single();
            if (data) {
                durasiLagu = data.duration_seconds;
                document.getElementById('status').innerText = "Data siap! Klik untuk mulai.";
            } else {
                document.getElementById('status').innerText = "Mulai menonton.";
            }
        }
        init();

        function mulaiNonton() {
            tg.openLink('https://www.youtube.com/watch?v=' + songId);
            document.getElementById('status').innerText = "Tunggu " + durasiLagu + " detik...";
            
            setTimeout(() => {
                document.getElementById('btn-claim').style.display = 'block';
                document.getElementById('status').innerText = "Waktu habis! Silakan klaim.";
            }, durasiLagu * 1000);
        }

        async function klaim() {
            const user = tg.initDataUnsafe?.user?.id || 0;
            document.getElementById('btn-claim').innerText = "Memproses...";
            const { error } = await sb.from('user_progress').insert([{telegram_id: user, song_id: songId}]);
            
            if (error) { alert("Error: " + error.message); } 
            else { tg.showAlert("Sukses! Poin masuk."); tg.close(); }
        }
    </script>
</body>
</html>
